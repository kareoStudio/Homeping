name: Build Debug APK from ZIP

on:
  push:
    paths:
      - '**/*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find & Extract ZIP
        run: |
          echo "Searching for ZIP file..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "Extracting to project/ folder..."

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project/

          echo "Extracted contents:"
          ls -la project/

          ITEMS=$(ls -1 project/ | wc -l)
          if [ "$ITEMS" -eq 1 ]; then
            SUBDIR=$(ls -1 project/ | head -n 1)
            if [ -d "project/$SUBDIR" ]; then
              echo "Single folder detected: $SUBDIR"
              mv project/"$SUBDIR"/* project/ 2>/dev/null || true
              mv project/"$SUBDIR"/.* project/ 2>/dev/null || true
              rmdir project/"$SUBDIR" 2>/dev/null || true
            fi
          fi

          echo "Final project structure:"
          ls -la project/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Generate Gradle Wrapper (if missing)
        working-directory: ./project
        run: |
          if [ -f "gradlew" ]; then
            echo "gradlew already exists - skipping wrapper generation"
            exit 0
          fi

          echo "gradlew missing! Generating Gradle Wrapper..."

          GRADLE_VERSION="8.5"
          if [ -f "gradle/libs.versions.toml" ]; then
            DETECTED=$(grep -oE 'gradleVersion[[:space:]]*=[[:space:]]*"[^"]+' gradle/libs.versions.toml | head -n 1 | sed 's/.*"//')
            if [ -n "$DETECTED" ]; then
              GRADLE_VERSION="$DETECTED"
            fi
          fi

          echo "Using Gradle version: $GRADLE_VERSION"

          mkdir -p gradle/wrapper

          # Create gradle-wrapper.properties
          printf '%s\n'             'distributionBase=GRADLE_USER_HOME'             'distributionPath=wrapper/dists'             "distributionUrl=https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip"             'networkTimeout=10000'             'validateDistributionUrl=true'             'zipStoreBase=GRADLE_USER_HOME'             'zipStorePath=wrapper/dists'             > gradle/wrapper/gradle-wrapper.properties

          # Download official gradlew script
          curl -fsSL -o gradlew "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}.0/gradlew"

          # Download official gradlew.bat
          curl -fsSL -o gradlew.bat "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}.0/gradlew.bat"

          # Download gradle-wrapper.jar
          curl -fsSL -o gradle/wrapper/gradle-wrapper.jar "https://raw.githubusercontent.com/gradle/gradle/v${GRADLE_VERSION}.0/gradle/wrapper/gradle-wrapper.jar"

          chmod +x gradlew

          echo "Gradle Wrapper generated!"
          ls -la gradlew
          ls -la gradle/wrapper/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('project/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        working-directory: ./project
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./project
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
