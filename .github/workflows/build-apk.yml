name: Build Debug APK from ZIP

on:
  push:
    paths:
      - '**/*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find & Extract ZIP
        run: |
          echo "🔍 Searching for ZIP file..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)
          
          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found!"
            exit 1
          fi
          
          echo "✅ Found ZIP: $ZIP_FILE"
          echo "📦 Extracting..."
          
          # Extract ZIP
          unzip -q "$ZIP_FILE" -d extracted_src/
          
          echo "📂 Extracted contents:"
          ls -la extracted_src/
          
          # Agar ZIP ke andar ek single folder ho (jaise homeping/)
          # toh uske contents ko root pe lao
          ITEMS=$(ls -1 extracted_src/ | wc -l)
          if [ "$ITEMS" -eq 1 ]; then
            SUBDIR=$(ls -1 extracted_src/ | head -n 1)
            echo "📁 Single folder detected: $SUBDIR"
            mv extracted_src/"$SUBDIR"/* extracted_src/"$SUBDIR"/.* . 2>/dev/null || true
            rm -rf extracted_src/"$SUBDIR"
          fi
          
          echo "✨ Final structure:"
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
