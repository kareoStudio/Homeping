name: Build Debug APK from ZIP

on:
  push:
    paths:
      - '**/*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find & Extract ZIP
        run: |
          echo "Searching for ZIP file..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          echo "Found ZIP: $ZIP_FILE"
          echo "Extracting to project/ folder..."

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project/

          echo "Extracted contents:"
          ls -la project/

          ITEMS=$(ls -1 project/ | wc -l)
          if [ "$ITEMS" -eq 1 ]; then
            SUBDIR=$(ls -1 project/ | head -n 1)
            if [ -d "project/$SUBDIR" ]; then
              echo "Single folder detected: $SUBDIR"
              mv project/"$SUBDIR"/* project/ 2>/dev/null || true
              mv project/"$SUBDIR"/.* project/ 2>/dev/null || true
              rmdir project/"$SUBDIR" 2>/dev/null || true
            fi
          fi

          echo "Final project structure:"
          ls -la project/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 9.3.1
        run: |
          GRADLE_VERSION="9.3.1"
          echo "Installing Gradle $GRADLE_VERSION..."

          wget -q "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt/

          GRADLE_HOME="/opt/gradle-${GRADLE_VERSION}"
          echo "$GRADLE_HOME/bin" >> $GITHUB_PATH

          export PATH="$GRADLE_HOME/bin:$PATH"
          gradle --version

      - name: Generate Gradle Wrapper
        working-directory: ./project
        run: |
          if [ -f "gradlew" ]; then
            echo "gradlew already exists"
            exit 0
          fi

          echo "Generating Gradle Wrapper..."
          gradle wrapper --gradle-version 9.3.1

          ls -la gradlew
          cat gradle/wrapper/gradle-wrapper.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('project/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        working-directory: ./project
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./project
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
