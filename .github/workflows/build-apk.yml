name: Build Debug APK from ZIP

on:
  push:
    paths:
      - '**/*.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Find & Extract ZIP
        run: |
          echo "🔍 Searching for ZIP file..."
          ZIP_FILE=$(find . -maxdepth 2 -name "*.zip" -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "❌ No ZIP file found!"
            exit 1
          fi

          echo "✅ Found ZIP: $ZIP_FILE"
          echo "📦 Extracting to project/ folder..."

          mkdir -p project
          unzip -q "$ZIP_FILE" -d project/

          echo "📂 Extracted contents:"
          ls -la project/

          # Agar ZIP ke andar ek single folder ho
          ITEMS=$(ls -1 project/ | wc -l)
          if [ "$ITEMS" -eq 1 ]; then
            SUBDIR=$(ls -1 project/ | head -n 1)
            if [ -d "project/$SUBDIR" ]; then
              echo "📁 Single folder detected: $SUBDIR"
              mv project/"$SUBDIR"/* project/ 2>/dev/null || true
              mv project/"$SUBDIR"/.* project/ 2>/dev/null || true
              rmdir project/"$SUBDIR" 2>/dev/null || true
            fi
          fi

          echo "✨ Final project structure:"
          ls -la project/

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Generate Gradle Wrapper (if missing)
        working-directory: ./project
        run: |
          if [ ! -f "gradlew" ]; then
            echo "⚠️ gradlew missing! Generating Gradle Wrapper..."

            # Check if gradle-wrapper.properties exists
            if [ ! -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              echo "📁 Creating gradle/wrapper directory..."
              mkdir -p gradle/wrapper

              # Detect Gradle version from libs.versions.toml or use default
              GRADLE_VERSION="8.5"
              if [ -f "gradle/libs.versions.toml" ]; then
                DETECTED=$(grep -oP 'gradleVersion\s*=\s*"\K[^"]+' gradle/libs.versions.toml 2>/dev/null || true)
                if [ -n "$DETECTED" ]; then
                  GRADLE_VERSION="$DETECTED"
                fi
              fi

              echo "🔧 Using Gradle version: $GRADLE_VERSION"

              cat > gradle/wrapper/gradle-wrapper.properties << EOF
distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip
networkTimeout=10000
validateDistributionUrl=true
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
EOF
            fi

            # Download gradle-wrapper.jar
            mkdir -p gradle/wrapper
            curl -L -o gradle/wrapper/gradle-wrapper.jar               "https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar"

            # Create gradlew script
            cat > gradlew << 'SCRIPT'
#!/bin/sh
# Gradle start up script for POSIX generated by Gradle

# Attempt to set APP_HOME
# Resolve links: $0 may be a link
PRG="$0"
# Need this for relative symlinks.
while [ -h "$PRG" ] ; do
    ls=`ls -ld "$PRG"`
    link=`expr "$ls" : '.*-> \(.*\)$'`
    if expr "$link" : '/.*' > /dev/null; then
        PRG="$link"
    else
        PRG=`dirname "$PRG"`"/$link"
    fi
done
SAVED="`pwd`"
cd "`dirname "$PRG"`/" >/dev/null
APP_HOME="`pwd -P`"
cd "$SAVED" >/dev/null

APP_NAME="Gradle"
APP_BASE_NAME=`basename "$0"`

# Add default JVM options here
DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'

# Use the maximum available, or set MAX_FD != -1 to use that value.
MAX_FD="maximum"

warn () {
    echo "$*"
}

die () {
    echo
    echo "$*"
    echo
    exit 1
}

# OS specific support (must be 'true' or 'false').
cygwin=false
msys=false
darwin=false
nonstop=false
case "`uname`" in
  CYGWIN* )
    cygwin=true
    ;;
  Darwin* )
    darwin=true
    ;;
  MINGW* )
    msys=true
    ;;
  NONSTOP* )
    nonstop=true
    ;;
esac

CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar

# Determine the Java command to use to start the JVM.
if [ -n "$JAVA_HOME" ] ; then
    if [ -x "$JAVA_HOME/jre/sh/java" ] ; then
        # IBM's JDK on AIX uses strange locations for the executables
        JAVACMD="$JAVA_HOME/jre/sh/java"
    else
        JAVACMD="$JAVA_HOME/bin/java"
    fi
    if [ ! -x "$JAVACMD" ] ; then
        die "ERROR: JAVA_HOME is set to an invalid directory: $JAVA_HOME"
    fi
else
    JAVACMD="java"
    which java >/dev/null 2>&1 || die "ERROR: JAVA_HOME is not set and no 'java' command could be found in your PATH"
fi

# Increase the maximum file descriptors if we can.
if [ "$cygwin" = "false" -a "$darwin" = "false" -a "$nonstop" = "false" ] ; then
    MAX_FD_LIMIT=`ulimit -H -n`
    if [ $? -eq 0 ] ; then
        if [ "$MAX_FD" = "maximum" -o "$MAX_FD" = "max" ] ; then
            MAX_FD="$MAX_FD_LIMIT"
        fi
        ulimit -n $MAX_FD
        if [ $? -ne 0 ] ; then
            warn "Could not set maximum file descriptor limit: $MAX_FD"
        fi
    else
        warn "Could not query maximum file descriptor limit: $MAX_FD_LIMIT"
    fi
fi

# For Darwin, add options to specify how the application appears in the dock
if [ "$darwin" = "true" ]; then
    GRADLE_OPTS="$GRADLE_OPTS \"-Xdock:name=$APP_NAME\" \"-Xdock:icon=$APP_HOME/media/gradle.icns\""
fi

# For Cygwin or MSYS, switch paths to Windows format before running java
if [ "$cygwin" = "true" -o "$msys" = "true" ] ; then
    APP_HOME=`cygpath --path --mixed "$APP_HOME"`
    CLASSPATH=`cygpath --path --mixed "$CLASSPATH"`
    JAVACMD=`cygpath --unix "$JAVACMD"`
fi

exec "$JAVACMD" $DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS \
  "-Dorg.gradle.appname=$APP_BASE_NAME" \
  -classpath "$CLASSPATH" \
  org.gradle.wrapper.GradleWrapperMain "$@"
SCRIPT

            chmod +x gradlew
            echo "✅ Gradle Wrapper generated successfully!"
          else
            echo "✅ gradlew already exists"
          fi

          ls -la gradlew
          ls -la gradle/wrapper/

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('project/**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Grant execute permission for gradlew
        working-directory: ./project
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: ./project
        run: ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
